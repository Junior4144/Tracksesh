<nav class="navbar navbar-expand-md sticky-top">
  <div class="container-sm">

    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" routerLink="/dashboard">
      <svg width="28" height="28" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="22" stroke="var(--accent)" stroke-width="2.5"/>
        <circle cx="24" cy="24" r="16" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.5"/>
        <line x1="24" y1="24" x2="24" y2="11" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="24" y1="24" x2="32" y2="28" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="24" r="2.5" fill="var(--accent)"/>
      </svg>
      <span class="brand-name">Tracksesh</span>
    </a>

    <!-- Mobile toggler -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navMenu"
      aria-controls="navMenu"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-1">

        @if (auth.isLoggedIn()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
              <svg class="me-1" width="15" height="15" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z"/>
                <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0z"/>
              </svg>
              Timer
            </a>
          </li>

          <li class="nav-item">
            <span class="nav-user-name d-none d-md-inline-block px-2 text-muted small">
              Welcome back, {{ auth.displayName() }}
            </span>
          </li>

          <li class="nav-item">
            <button class="btn btn-outline-danger btn-sm ms-1" (click)="auth.logout()">
              Sign out
            </button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Sign in</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-accent btn-sm ms-1" routerLink="/register">Get started</a>
          </li>
        }

        <!-- Theme toggle -->
        <li class="nav-item ms-2">
          <button
            class="btn btn-theme-toggle"
            (click)="theme.toggle()"
            [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
            [title]="theme.isDark() ? 'Light mode' : 'Dark mode'"
          >
            @if (theme.isDark()) {
              <!-- Sun icon -->
              <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>
              </svg>
            } @else {
              <!-- Moon icon -->
              <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor">
                <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
              </svg>
            }
          </button>
        </li>

      </ul>
    </div>
  </div>
</nav>
