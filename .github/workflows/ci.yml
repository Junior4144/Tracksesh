name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TRAFFIC_ENABLED: 'false'
  TRAFFIC_INGRESS_LOCKED: 'false'
  TRAFFIC_TRUSTED_PROXY_HOPS: '0'

jobs:
  security:
    name: Dependency security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: npm ci

      # ── The database ────────────────────────────────────────────────────
      #
      # A plain `postgres:` service container is not enough, and substituting
      # one would quietly gut the most important tests here. What
      # Tracksesh.Api.Tests exercises is the RLS policies, `auth.uid()` and the
      # `authenticated` role — none of which exist in stock Postgres. They come
      # from the Supabase stack, which also applies supabase/migrations for us.
      #
      # Disposable test DB + auth: the browser talks to GoTrue, the API talks to
      # Postgres, and PostgREST is deliberately not exposed at all. Skipping the
      # rest saves a couple of minutes of image pulls per run.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest

      - name: Start disposable Supabase for isolation checks
        run: >
          supabase start
          -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor

      - name: Read local stack config
        run: |
          supabase status -o env | grep -E '^[A-Z_]+=' > "$RUNNER_TEMP/sb.env"
          . "$RUNNER_TEMP/sb.env"
          # CI always targets this disposable stack. Development settings now
          # point at hosted Supabase and contain no database connection.
          test -n "$API_URL" && test -n "$PUBLISHABLE_KEY"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "Supabase__Url=$API_URL"
            echo "Supabase__PublishableKey=$PUBLISHABLE_KEY"
            echo "ConnectionStrings__Postgres=Host=127.0.0.1;Port=54322;Database=postgres;Username=postgres;Password=postgres"
            echo "DATABASE_URL_ADO=Host=127.0.0.1;Port=54322;Database=postgres;Username=postgres;Password=postgres"
          } >> "$GITHUB_ENV"

      # The login page advertises this account and both the CSP check and the
      # Playwright suite sign in as it. A fresh database has no users.
      - run: npm run setup:demo

      # ── Static checks ───────────────────────────────────────────────────
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:deployment
      - run: dotnet build server --configuration Release

      # ── The security guards ─────────────────────────────────────────────
      #
      # These are the reason this job bothers with a real database. If they are
      # ever moved to a "main only" job, a pull request can go green while
      # removing the thing that keeps one user's ledger away from another's.
      - name: RLS isolation tests
        run: npm run test:api:integration

      # ── The built artefact ──────────────────────────────────────────────
      - name: Build the SPA
        run: npm run build

      - name: Start the API over the built SPA
        run: |
          # Explicit environment above supplies the disposable local stack.
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS=http://localhost:5251 \
          nohup dotnet run --project server/Tracksesh.Api --no-launch-profile \
            -p:BaseOutputPath=obj/ci-bin/ > "$RUNNER_TEMP/api.log" 2>&1 &

          for i in $(seq 1 60); do
            curl -sf http://localhost:5251/api/health && break
            sleep 2
          done
          curl -sf http://localhost:5251/api/health || { cat "$RUNNER_TEMP/api.log"; exit 1; }

      # Needed by both steps below, not just the Playwright one: scripts/csp-check.mjs
      # drives a real Chromium too. Installed here rather than next to `npm ci`
      # so a typecheck or lint failure still fails in seconds instead of waiting
      # on a browser download.
      - run: npx playwright install --with-deps chromium

      # `vite dev` never applies the Content-Security-Policy — the API sets it,
      # on the production build. Without this step a broken policy ships.
      - name: CSP check
        run: npm run test:csp

      - name: Public SEO and routing checks
        run: npm run test:seo

      - name: Admin HTTP access checks
        run: node scripts/check-admin-access.mjs

      - name: Admin and site-isolation browser checks over production SPA
        env:
          UI_BASE_URL: http://localhost:5251
        run: npx playwright test -c playwright.ui.config.ts admin.spec.ts

      - name: Playwright layout checks
        run: npm run e2e

      # Cover every workspace and its interactions at mobile, laptop and desktop
      # widths. These suites use fixtures, so they do not mutate the demo user.
      - name: Responsive workspace and interaction checks
        run: npx playwright test -c playwright.ui.config.ts ui.spec.ts study-suite.spec.ts --workers=4

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Built but not pushed. A Dockerfile that only gets exercised at deploy
      # time is a Dockerfile that breaks at deploy time — and the VITE_* values
      # here are placeholders precisely because this artefact is thrown away.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          build-args: |
            VITE_SUPABASE_URL=http://127.0.0.1:54321
            VITE_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
