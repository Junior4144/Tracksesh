name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ''

# One deploy at a time, and never cancelled halfway.
#
# Two concurrent runs would both push an image and then both ask for "the newest
# one", and at least one would deploy the other's build. `cancel-in-progress` is
# deliberately false: aborting between the push and the deployment leaves the
# service on its old version with an orphaned image, which is recoverable but
# confusing.
concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-request:
    runs-on: ubuntu-latest
    steps:
      - name: Require main and explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ] || [ "$CONFIRM" != 'deploy' ]; then
            echo "::error::Run from main and type deploy to confirm."
            exit 1
          fi

  checks:
    needs: validate-request
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Build and deploy to Lightsail
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SERVICE_NAME: ${{ vars.LIGHTSAIL_SERVICE_NAME }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate production configuration before building or pushing
        env:
          POSTGRES_CONNECTION: ${{ secrets.POSTGRES_CONNECTION }}
          TRAFFIC_RUNTIME_CONFIG: ${{ secrets.TRAFFIC_RUNTIME_CONFIG }}
        run: |
          test -n "$AWS_REGION" || { echo '::error::Missing AWS_REGION'; exit 1; }
          test -n "$SERVICE_NAME" || { echo '::error::Missing LIGHTSAIL_SERVICE_NAME'; exit 1; }
          node scripts/prepare-deployment.mjs

      # TEMPORARY — delete once the deploy is green again.
      #
      # Prints the identity the runner actually presents to AWS, which is the
      # one thing "Not authorized to perform sts:AssumeRoleWithWebIdentity"
      # refuses to tell you. Whatever `sub` says has to match the StringLike
      # condition on the role's trust policy character for character.
      #
      # Only the four claims are echoed, never the token: it is a live
      # credential for the next few minutes, and this repository's logs are
      # public now.
      - name: Show the OIDC subject
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c "
          import sys, base64, json
          p = sys.stdin.read().strip()
          d = json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
          print(json.dumps({k: d.get(k) for k in
                ('sub', 'aud', 'repository', 'repository_owner')}, indent=2))
          "

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Lightsail container push helper
        run: |
          curl --fail --silent --show-error --location \
            https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl \
            -o "$RUNNER_TEMP/lightsailctl"
          chmod +x "$RUNNER_TEMP/lightsailctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build the image
        run: |
          docker build \
            --build-arg "VITE_SUPABASE_URL=$SUPABASE_URL" \
            --build-arg "VITE_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            -t "tracksesh:$GITHUB_SHA" .

      - name: Push to Lightsail
        id: push
        run: |
          aws lightsail push-container-image \
            --region "$AWS_REGION" \
            --service-name "$SERVICE_NAME" \
            --label app \
            --image "tracksesh:${{ github.sha }}"

          # Lightsail rewrites the tag to `:<service>.<label>.<n>` and only that
          # name is deployable, so it has to be read back rather than assumed.
          #
          # Asked for, not scraped from the command's output: the human-readable
          # line it prints is not a contract, and a wording change would leave
          # this parsing a message that no longer contains what it wants. Sorting
          # by createdAt rather than trusting the list order makes "the one we
          # just pushed" explicit.
          IMAGE=$(aws lightsail get-container-images \
            --region "$AWS_REGION" \
            --service-name "$SERVICE_NAME" \
            --query 'sort_by(containerImages, &createdAt)[-1].image' \
            --output text)

          if [ -z "$IMAGE" ] || [ "$IMAGE" = "None" ]; then
            echo "::error::Could not determine the pushed image name."
            exit 1
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: release
        env:
          DEPLOY_IMAGE: ${{ steps.push.outputs.image }}
          POSTGRES_CONNECTION: ${{ secrets.POSTGRES_CONNECTION }}
          TRAFFIC_RUNTIME_CONFIG: ${{ secrets.TRAFFIC_RUNTIME_CONFIG }}
        run: |
          umask 077
          node scripts/prepare-deployment.mjs "$RUNNER_TEMP/containers.json"
          trap 'rm -f "$RUNNER_TEMP/containers.json"' EXIT
          ENDPOINT='{"containerName":"app","containerPort":8080,"healthCheck":{"path":"/api/health","intervalSeconds":10,"timeoutSeconds":5,"healthyThreshold":2,"unhealthyThreshold":3,"successCodes":"200"}}'
          # Full AWS responses contain environment secrets; only read the version.
          VERSION=$(aws lightsail create-container-service-deployment \
            --region "$AWS_REGION" --service-name "$SERVICE_NAME" \
            --containers "file://$RUNNER_TEMP/containers.json" --public-endpoint "$ENDPOINT" \
            --query 'containerService.nextDeployment.version' --output text)
          [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo '::error::Missing new deployment version'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact deployment to go live
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_IMAGE: ${{ steps.push.outputs.image }}
        run: |
          for i in $(seq 1 60); do
            SNAPSHOT=$(aws lightsail get-container-services \
              --region "$AWS_REGION" --service-name "$SERVICE_NAME" \
              --query 'containerServices[0].{current:currentDeployment.{version:version,state:state,image:containers.app.image},next:nextDeployment.{version:version,state:state}}' --output json)
            if jq -e --argjson version "$EXPECTED_VERSION" --arg image "$EXPECTED_IMAGE" \
              '.current.version == $version and .current.state == "ACTIVE" and .current.image == $image' <<< "$SNAPSHOT" >/dev/null; then
              echo "Deployment $EXPECTED_VERSION is active."
              exit 0
            fi
            if jq -e --argjson version "$EXPECTED_VERSION" \
              '(.next.version == $version and .next.state == "FAILED") or (.current.version == $version and .current.state == "FAILED")' <<< "$SNAPSHOT" >/dev/null; then
              echo '::error::The new deployment failed.'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Timed out waiting for the new image. An older ACTIVE version is not success.'
          exit 1

      - name: Smoke test
        run: |
          URL=$(aws lightsail get-container-services --region "$AWS_REGION" --service-name "$SERVICE_NAME" \
            --query 'containerServices[0].url' --output text)
          node scripts/deployment-smoke.mjs "$URL"
          node scripts/deployment-smoke.mjs https://tracksesh.com
          echo "Live at $URL"
