name: Dependency security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read

jobs:
  audit:
    name: npm and NuGet audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Audit all npm dependencies, including build and test tools
        run: npm audit --audit-level=low
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Audit direct and transitive NuGet dependencies
        run: dotnet restore server --force -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904,NU1905
